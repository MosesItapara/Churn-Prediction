<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Customer Churn Predictor</title>
<style>
  :root {
    --card: #ffffff;
    --accent: #4f46e5;
    --accent-dark: #4338ca;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --radius: 16px;
    --stay: #16a34a;
    --leave: #dc2626;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: linear-gradient(-45deg, #0f172a, #1e1b4b, #1e293b, #312e81);
    background-size: 400% 400%;
    animation: gradientShift 18s ease infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .wrapper {
    width: 100%;
    max-width: 760px;
  }

  .header {
    text-align: center;
    color: #f1f5f9;
    margin-bottom: 24px;
  }

  .header h1 {
    margin: 0 0 6px;
    font-size: 1.9rem;
    font-weight: 700;
  }

  .header p {
    margin: 0;
    color: #94a3b8;
    font-size: 0.95rem;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    padding: 32px;
    animation: cardIn 0.5s ease;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  form {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px 24px;
  }

  .field { display: flex; flex-direction: column; gap: 8px; }
  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  label .value {
    color: var(--accent);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--fill, 50%), var(--border) var(--fill, 50%), var(--border) 100%);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.12s;
  }

  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }

  input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    cursor: pointer;
  }

  .pill-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pill {
    flex: 1;
    min-width: 70px;
    text-align: center;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    background: #f8fafc;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--muted);
    transition: all 0.15s;
    user-select: none;
  }

  .pill:hover { border-color: var(--accent); color: var(--accent-dark); }

  .pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
  }

  .submit-btn {
    grid-column: 1 / -1;
    margin-top: 8px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .submit-btn:hover:not(:disabled) { background: var(--accent-dark); }
  .submit-btn:active:not(:disabled) { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.75; cursor: not-allowed; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2.5px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    display: none;
    animation: spin 0.7s linear infinite;
  }

  .submit-btn.loading .spinner { display: inline-block; }
  .submit-btn.loading .btn-label { opacity: 0.85; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-banner {
    grid-column: 1 / -1;
    display: none;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
  }

  .error-banner.show { display: block; }

  /* Result panel */
  .result-panel {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transform: translateY(-8px);
    transition: max-height 0.4s ease, opacity 0.35s ease, transform 0.35s ease, margin-top 0.4s ease;
  }

  .result-panel.show {
    max-height: 420px;
    opacity: 1;
    transform: translateY(0);
    margin-top: 24px;
  }

  .result-inner {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 22px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: #f8fafc;
    flex-wrap: wrap;
    justify-content: center;
  }

  .gauge-wrap { position: relative; width: 120px; height: 120px; flex-shrink: 0; }

  .gauge-wrap svg { transform: rotate(-90deg); }

  .gauge-bg { fill: none; stroke: var(--border); stroke-width: 10; }

  .gauge-fill {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dasharray 0.9s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.4s;
  }

  .gauge-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .result-text { flex: 1; min-width: 180px; }

  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }

  .result-badge.stay { background: rgba(22, 163, 74, 0.12); color: var(--stay); }
  .result-badge.leave { background: rgba(220, 38, 38, 0.12); color: var(--leave); }

  .result-desc { color: var(--muted); font-size: 0.9rem; line-height: 1.4; margin: 0; }

  .footer-note {
    text-align: center;
    color: #94a3b8;
    font-size: 0.78rem;
    margin-top: 18px;
  }

  @media (max-width: 560px) {
    form { grid-template-columns: 1fr; }
    .card { padding: 24px 20px; }
    .result-inner { flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>Bank Customer Churn Predictor</h1>
      <p>Adjust the sliders to profile a customer and get a live churn risk estimate</p>
    </div>

    <div class="card">
      <form id="churnForm">
        <div class="field">
          <label for="CreditScore">Credit Score <span class="value" id="CreditScoreVal">650</span></label>
          <input type="range" id="CreditScore" name="CreditScore" min="350" max="850" value="650" required>
        </div>

        <div class="field">
          <label for="Age">Age <span class="value" id="AgeVal">40</span></label>
          <input type="range" id="Age" name="Age" min="18" max="92" value="40" required>
        </div>

        <div class="field full">
          <label>Geography</label>
          <div class="pill-group" data-group="Geography">
            <div class="pill" data-value="France">France</div>
            <div class="pill" data-value="Germany">Germany</div>
            <div class="pill" data-value="Spain">Spain</div>
          </div>
          <input type="hidden" name="Geography" required>
        </div>

        <div class="field full">
          <label>Gender</label>
          <div class="pill-group" data-group="Gender">
            <div class="pill" data-value="Male">Male</div>
            <div class="pill" data-value="Female">Female</div>
          </div>
          <input type="hidden" name="Gender" required>
        </div>

        <div class="field">
          <label for="Tenure">Tenure <span class="value" id="TenureVal">5 yrs</span></label>
          <input type="range" id="Tenure" name="Tenure" min="0" max="10" value="5" required>
        </div>

        <div class="field">
          <label for="NumOfProducts">Products <span class="value" id="NumOfProductsVal">2</span></label>
          <input type="range" id="NumOfProducts" name="NumOfProducts" min="1" max="4" value="2" required>
        </div>

        <div class="field">
          <label for="Balance">Balance <span class="value" id="BalanceVal">$75,000</span></label>
          <input type="range" id="Balance" name="Balance" min="0" max="250000" step="500" value="75000" required>
        </div>

        <div class="field">
          <label for="EstimatedSalary">Est. Salary <span class="value" id="EstimatedSalaryVal">$60,000</span></label>
          <input type="range" id="EstimatedSalary" name="EstimatedSalary" min="0" max="200000" step="500" value="60000" required>
        </div>

        <div class="field full">
          <label>Has Credit Card?</label>
          <div class="pill-group" data-group="HasCrCard">
            <div class="pill" data-value="1">Yes</div>
            <div class="pill" data-value="0">No</div>
          </div>
          <input type="hidden" name="HasCrCard" required>
        </div>

        <div class="field full">
          <label>Is Active Member?</label>
          <div class="pill-group" data-group="IsActiveMember">
            <div class="pill" data-value="1">Yes</div>
            <div class="pill" data-value="0">No</div>
          </div>
          <input type="hidden" name="IsActiveMember" required>
        </div>

        <div class="error-banner" id="errorBanner"></div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="spinner"></span>
          <span class="btn-label">Predict Churn</span>
        </button>
      </form>

      <div class="result-panel" id="resultPanel">
        <div class="result-inner">
          <div class="gauge-wrap">
            <svg width="120" height="120" viewBox="0 0 120 120">
              <circle class="gauge-bg" cx="60" cy="60" r="50"></circle>
              <circle class="gauge-fill" id="gaugeFill" cx="60" cy="60" r="50" stroke="#4f46e5"></circle>
            </svg>
            <div class="gauge-label" id="gaugeLabel">0%</div>
          </div>
          <div class="result-text">
            <div class="result-badge" id="resultBadge">Result</div>
            <p class="result-desc" id="resultDesc">Fill in the form and submit to see a prediction.</p>
          </div>
        </div>
      </div>
    </div>

    <p class="footer-note">Model served via Flask &middot; scikit-learn preprocessing pipeline</p>
  </div>

<script>
  const sliders = {
    CreditScore: v => v,
    Age: v => v,
    Tenure: v => v + ' yrs',
    NumOfProducts: v => v,
    Balance: v => '$' + Number(v).toLocaleString(),
    EstimatedSalary: v => '$' + Number(v).toLocaleString()
  };

  Object.keys(sliders).forEach(id => {
    const input = document.getElementById(id);
    const label = document.getElementById(id + 'Val');
    const update = () => {
      const pct = ((input.value - input.min) / (input.max - input.min)) * 100;
      input.style.setProperty('--fill', pct + '%');
      label.textContent = sliders[id](input.value);
    };
    input.addEventListener('input', update);
    update();
  });

  document.querySelectorAll('.pill-group').forEach(group => {
    const hidden = group.parentElement.querySelector('input[type="hidden"]');
    group.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', () => {
        group.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        hidden.value = pill.dataset.value;
      });
    });
  });

  const form = document.getElementById('churnForm');
  const submitBtn = document.getElementById('submitBtn');
  const errorBanner = document.getElementById('errorBanner');
  const resultPanel = document.getElementById('resultPanel');
  const gaugeFill = document.getElementById('gaugeFill');
  const gaugeLabel = document.getElementById('gaugeLabel');
  const resultBadge = document.getElementById('resultBadge');
  const resultDesc = document.getElementById('resultDesc');

  const CIRCUMFERENCE = 2 * Math.PI * 50;
  gaugeFill.style.strokeDasharray = `0 ${CIRCUMFERENCE}`;

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.classList.add('show');
  }

  function clearError() {
    errorBanner.classList.remove('show');
    errorBanner.textContent = '';
  }

  function animateGauge(pct, isChurn) {
    const color = isChurn ? '#dc2626' : '#16a34a';
    gaugeFill.setAttribute('stroke', color);
    const offset = (pct / 100) * CIRCUMFERENCE;
    requestAnimationFrame(() => {
      gaugeFill.style.strokeDasharray = `${offset} ${CIRCUMFERENCE}`;
    });

    let start = null;
    const duration = 700;
    function step(ts) {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      gaugeLabel.textContent = Math.round(progress * pct) + '%';
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    for (const hidden of form.querySelectorAll('input[type="hidden"]')) {
      if (!hidden.value) {
        showError('Please choose a value for every field.');
        return;
      }
    }

    submitBtn.disabled = true;
    submitBtn.classList.add('loading');

    try {
      const formData = new FormData(form);
      const res = await fetch('/predict', { method: 'POST', body: formData });
      const data = await res.json();

      if (!res.ok || data.error) {
        showError(data.error || 'Prediction failed. Please try again.');
        return;
      }

      const pct = data.probability !== null ? Math.round(data.probability * 100) : (data.churn ? 100 : 0);
      animateGauge(pct, data.churn);

      resultBadge.textContent = data.churn ? 'Likely to Churn' : 'Likely to Stay';
      resultBadge.className = 'result-badge ' + (data.churn ? 'leave' : 'stay');
      resultDesc.textContent = data.churn
        ? 'This customer profile shows a high risk of leaving the bank. Consider proactive retention outreach.'
        : 'This customer profile shows a low risk of churning based on the current inputs.';

      resultPanel.classList.add('show');
      resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (err) {
      showError('Could not reach the server. Please try again.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.classList.remove('loading');
    }
  });
</script>
</body>
</html>
